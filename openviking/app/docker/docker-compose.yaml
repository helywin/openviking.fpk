services:
  openviking:
    image: ghcr.io/volcengine/openviking:v0.4.16@sha256:46f9e34cd37238c28cbd9535033773d179006bdf7f3e528dd1c46567abce7701
    container_name: openviking-fnos
    restart: unless-stopped
    entrypoint: ["python", "/fpk-tools/serve.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import urllib.request; assert Path('/app/.openviking/.fnos-ready').is_file(); assert urllib.request.urlopen('http://127.0.0.1:1933/ready', timeout=3).status == 200"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    environment:
      OPENVIKING_WITH_BOT: "0"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    ports:
      - "${TRIM_SERVICE_PORT}:1933"
    volumes:
      - "${TRIM_PKGVAR}/openviking:/app/.openviking"
      - "${TRIM_APPDEST}/tools:/fpk-tools:ro"
      - "${TRIM_APPDEST}/tools/connect.html:/app/.venv/lib/python3.13/site-packages/openviking/web_studio/dist/fnos.html:ro"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
